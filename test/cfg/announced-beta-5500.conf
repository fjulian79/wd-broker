#------------------------------------------------------------------------------
# wd-broker Configuration File
#
# This file configures the wd-broker daemon and its default clients.
# Lines starting with '#' are comments.
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# Daemon configuration section
# The following options are used to configure the wd-broker daemon itself.
#------------------------------------------------------------------------------

# Path to the Unix domain socket used for client communication.
# Optional, default if missing: /run/wd-broker.sock
socket_path = /tmp/wd-broker-test.sock

# Hardware watchdog timeout in seconds.
# Must be between 10 and 60.
# Optional, default if missing: 10
wd_timeout_s = 10

# Optional path to a timeout hook script. If set, this script will be executed 
# by wd-broker in case of a client heartbeat timeout, after all internal actions
# have been performed and the system is expected to reboot. It's purpose is to 
# give you a chance to initiate a graceful shutdown, e.g. unmount filesystems, 
# bring hardware to a safe state, or send critical notifications to other 
# devices or systems.
#
# The script must be owned by the wd-broker service user and must not be 
# writable by group or others. Permissions 0700 are recommended. 
# timeout_hook_path = /usr/local/bin/wd-broker-timeout-hook

# When set to 'true', only clients explicitly announced in the configuration 
# file are allowed to register. The broker daemon will refuse to start if no 
# clients are defined and will reject all unregistration requests. Clients must 
# send heartbeat messages continuously to keep the watchdog alive.
#
# For maintenance purposes, it is still possible to unregister a client using 
# the 'wd-ctrl' command-line tool, but this requires root privileges.
#
# Use this setting when the list of clients is fixed and known in advance, and 
# strict control is more important than flexibility.
strict_clients = false

# When set to 'true', each announced client must have a unique name.
# The broker daemon will refuse to start if duplicate names are found in the 
# configuration file. During runtime, clients may only register if their name is
# not already registered by another active client.
unique_clients = false

#------------------------------------------------------------------------------
# Announced clients section
#
# ATTENTION: Announced clients nust register with the broker daemon
#            within the timeout period (see below), or the wd-broker daemon
#            will stop feeding the watchdog and the system will reboot. See
#            the wd-broker documentation for more details on a good system
#            design.
#
# Each client section starts with [client <name>]
#
# The client name should be unique. It must not be longer then 63 characters and
# may contain any printable character except ']'
#
# For each client, you can specify the following options:
# - timeout_ms: The time in milliseconds the client has to register with the
#            wd-broker daemon compared to the time the daemon started.
#------------------------------------------------------------------------------

#[client example-client-1]
#timeout_ms = 10000      

#[client example-client-2]
#timeout_ms = 30000      

[client beta]
timeout_ms = 5500     

#------------------------------------------------------------------------------
# May yor system live long and prosper!
#------------------------------------------------------------------------------
