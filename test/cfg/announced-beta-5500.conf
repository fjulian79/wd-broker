#------------------------------------------------------------------------------
# wd-broker Configuration File
#
# This file configures the wd-broker daemon and its default clients.
# Lines starting with '#' are comments.
#------------------------------------------------------------------------------

#------------------------------------------------------------------------------
# Daemon configuration section
# The following options are used to configure the wd-broker daemon itself.
#------------------------------------------------------------------------------

# Path to the Unix domain socket used for client communication.
# Optional, default if missing: /run/wd-broker.sock
socket_path = /tmp/wd-broker-test.sock

# Hardware watchdog timeout in seconds.
# Must be between 10 and 60.
# Optional, default if missing: 10
wd_timeout_s = 10

#------------------------------------------------------------------------------
# Announced clients section
#
# ATTENTION: Announced clients nust register with the broker daemon
#            within the timeout period (see below), or the wd-broker daemon
#            will stop feeding the watchdog and the system will reboot.
#
# Each client section starts with [client <name>]
#
# The client name should be unique. It must not be longer then 63 characters and
# may contain any printable character except ']'
#
# For each client, you can specify the following options:
# - timeout: The time in milliseconds the client has to register with the
#            wd-broker daemon compared to the time the daemon started.
#------------------------------------------------------------------------------

[client beta]
timeout = 5500      

#[client example-client-2]
#timeout = 30000      

#------------------------------------------------------------------------------
# May yor system live long and prosper!
#------------------------------------------------------------------------------
